name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[demo,dev]"
      - name: Lint
        run: ruff check fineprint/ tests/ benchmark/ server/
      - name: Tests
        # benchmark-warehouse-dependent cases skip themselves when artifacts are absent
        run: pytest tests/ -q
      - name: Build distribution
        if: matrix.python-version == '3.13'
        run: |
          pip install build
          python -m build

  windows:
    # 中文输出/树形字符/路径分隔符在 Windows 是真实雷区;跑核心测试集守住。
    # PYTHONUTF8 只为测试夹具(fixture 写中文)与 subprocess 捕获的确定性;
    # 产品代码自身已显式 encoding="utf-8",不依赖此变量(哨兵测试单独验证窄编码)
    runs-on: windows-latest
    permissions:
      contents: write   # 失败时把 pytest 摘要贴成提交评论(公开可读,便于无凭据侧诊断)
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          pytest tests/ -q --tb=short 2>&1 | tee pytest.out
      - name: Post failure output as commit comment
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PYEOF'
          import json, os, urllib.request
          tail = open("pytest.out", encoding="utf-8", errors="replace").read()[-50000:]
          body = f"CI windows py${{ matrix.python-version }} failure tail:\n```\n{tail}\n```"
          req = urllib.request.Request(
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json"})
          urllib.request.urlopen(req)
          PYEOF
      - name: CLI smoke on a narrow console codepage
        shell: cmd
        run: |
          chcp 1252
          python -m fineprint.cli --version
