name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[demo,dev]"
      - name: Lint
        run: ruff check metriclens/ tests/ benchmark/ server/
      - name: Tests
        # benchmark-warehouse-dependent cases skip themselves when artifacts are absent
        run: pytest tests/ -q
      - name: Build distribution
        if: matrix.python-version == '3.13'
        run: |
          pip install build
          python -m build
