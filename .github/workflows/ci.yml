name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[demo,dev]"
      - name: Lint
        run: ruff check fineprint/ tests/ benchmark/ server/
      - name: Tests
        # benchmark-warehouse-dependent cases skip themselves when artifacts are absent
        run: pytest tests/ -q
      - name: Build distribution
        if: matrix.python-version == '3.13'
        run: |
          pip install build
          python -m build

  windows:
    # 中文输出/树形字符/路径分隔符在 Windows 是真实雷区;跑核心测试集守住。
    # PYTHONUTF8 只为测试夹具(fixture 写中文)与 subprocess 捕获的确定性;
    # 产品代码自身已显式 encoding="utf-8",不依赖此变量(哨兵测试单独验证窄编码)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest tests/ -q
      - name: CLI smoke on a narrow console codepage
        shell: cmd
        run: |
          chcp 1252
          python -m fineprint.cli --version
