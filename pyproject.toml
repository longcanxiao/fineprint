[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fineprint"
version = "0.8.2"
description = "Read the fine print of your metrics — a decompiler for your dashboards: column-level lineage x LLM over dbt artifacts, evidence-bound caliber cards"
readme = "README.pypi.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["dbt", "lineage", "metrics", "data-governance", "semantic-layer", "sqlglot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
# 核心包只依赖解析与请求;数仓/看板/模拟器等 demo 依赖走 extras
dependencies = [
  "pyyaml>=6.0",
  "sqlglot>=30,<32",
  "requests>=2.28",
]

# 仓库公开后解开注释并填入真实地址,随下一个版本发布(PyPI 页面即有去处):
# [project.urls]
# Homepage = "https://github.com/<org>/<repo>"
# Repository = "https://github.com/<org>/<repo>"
# Issues = "https://github.com/<org>/<repo>/issues"
# Changelog = "https://github.com/<org>/<repo>/blob/main/CHANGELOG.md"

[project.scripts]
# 发行名 fineprint(指标口径的"小字条款");import 名与既有 CLI 暂保持 metriclens,
# 两个命令等价,全面改名另起版本
fineprint = "metriclens.cli:main"
metriclens = "metriclens.cli:main"

[project.optional-dependencies]
demo = [
  "duckdb", "dbt-duckdb", "pandas", "numpy", "faker",
  "fastapi", "uvicorn[standard]",
]
dev = ["pytest", "ruff", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["metriclens"]

# 发行物只含核心包:demo 数仓/看板/benchmark/设计文档/测试留在仓库,不随包发布
[tool.hatch.build.targets.sdist]
include = ["metriclens", "README.pypi.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["dashboard", ".venv", "warehouse/dbt_project/target"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
