[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metriclens"
version = "0.5.0"
description = "指标口径自动透出:电商数仓实验场 + 业务大盘 + 血缘×LLM 口径智能系统"
requires-python = ">=3.13"
dependencies = [
  "duckdb", "dbt-duckdb", "pandas", "numpy", "pyyaml", "faker",
  "fastapi", "uvicorn[standard]", "sqlglot", "requests",
]

[project.scripts]
metriclens = "metriclens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["metriclens"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["dashboard", ".venv", "warehouse/dbt_project/target"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
